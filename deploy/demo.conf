# The demo site (README.md, "The demo site"): a separate copy of Extas ERP with
# its own database and files, loaded with the Five Style Polo batch. Its address
# is demo.<your domain>: demo.yourcompany.com when the ERP is at
# erp.yourcompany.com. DEMO_DOMAIN in deploy/.env sets another one.
#   on   deploy.sh sets it up and keeps it running
#   off  deploy.sh stops it; its data stays in DATA_DIR/demo
# DEMO_SITE=off in deploy/.env turns it off on one server.
DEMO_SITE=on
