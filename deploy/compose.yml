# Extas ERP on one server: PostgreSQL 16, the app, and Caddy for HTTPS.
# Run it through the scripts in this folder (see README.md here). The settings
# come from deploy/.env, which configure.sh writes.
name: extras-erp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The database. Not reachable from outside the server: only the app and the
  # migrations talk to it, over the internal network.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-extras_erp}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/configure.sh first}
      # Checksums catch disk corruption; C.UTF-8 sorting never changes with updates.
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C.UTF-8
      # The app's own database user, made on first start (postgres/init-app-user.sh).
      APP_DB_USER: ${APP_DB_USER:-extras_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run deploy/configure.sh first}
    # Sized for a 4 to 8 GB server; raise the first two on a bigger one.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - idle_in_transaction_session_timeout=10min
      - -c
      - log_min_duration_statement=1s
    volumes:
      - ${DATA_DIR:-/srv/extras-erp}/postgres:/var/lib/postgresql/data
      - ./postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
      # Read-only, for restore.sh.
      - ${DATA_DIR:-/srv/extras-erp}/backups:/backups:ro
      - ${DATA_DIR:-/srv/extras-erp}/safety-copies:/safety-copies:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    networks: [internal]
    logging: *logging

  # Brings the database up to date with the code, then stops. The app waits for it.
  migrate:
    build:
      context: ..
      target: tools
    image: extras-erp-tools:latest
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-extras_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-extras_erp}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  # The ERP itself, with the daily backup, reminder and housekeeping clocks.
  app:
    build:
      context: ..
      target: runner
    image: extras-erp-app:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      APP_URL: https://${APP_DOMAIN:?Run deploy/configure.sh first}
      DATABASE_URL: postgresql://${APP_DB_USER:-extras_app}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-extras_erp}?schema=public&connection_limit=10
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run deploy/configure.sh first}
      # Keys of a server restored over (bootstrap.sh never replaces ENCRYPTION_KEY):
      # they still open the secrets they sealed. Comma-separated; usually empty.
      ENCRYPTION_OLD_KEYS: ${ENCRYPTION_OLD_KEYS:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      SAFETY_COPY_DIR: /data/safety-copies
      AI_API_KEY: ${AI_API_KEY:-}
      # The company's mailbox for sending; the owner usually sets it in AI Center > Settings instead.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_HTTP_URL: ${SMS_HTTP_URL:-}
      SMS_HTTP_METHOD: ${SMS_HTTP_METHOD:-}
      SMS_HTTP_BODY: ${SMS_HTTP_BODY:-}
      SMS_HTTP_SUCCESS: ${SMS_HTTP_SUCCESS:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-}
      PAYOUT_PROVIDER: ${PAYOUT_PROVIDER:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    volumes:
      - ${DATA_DIR:-/srv/extras-erp}/uploads:/data/uploads
      - ${DATA_DIR:-/srv/extras-erp}/backups:/data/backups
      # The update and restore safety copies, read-only: the app locks each and
      # sends it to Google Drive too (the server keeps them for 24 hours).
      - ${DATA_DIR:-/srv/extras-erp}/safety-copies:/data/safety-copies:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
    # internal: the database. edge: Caddy, and the internet (Google Drive backups).
    networks: [internal, edge]
    logging: *logging

  # HTTPS: gets and renews the Let's Encrypt certificate and sends traffic to the app.
  # Plain Caddy; while a Cloudflare token is in deploy/.env, Caddy with Cloudflare's
  # DNS module instead (deploy.sh builds it from deploy/caddy and sets CADDY_IMAGE).
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Run deploy/configure.sh first}
      ACME_EMAIL: ${ACME_EMAIL:?Run deploy/configure.sh first}
      # Only read while certificates come through Cloudflare's DNS check.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare's DNS check, while it is on (deploy.sh writes cloudflare.caddy here).
      - ${DATA_DIR:-/srv/extras-erp}/caddy/tls:/etc/caddy/tls:ro
      # The demo site's part, while it is on (deploy.sh copies demo.caddy here).
      - ${DATA_DIR:-/srv/extras-erp}/caddy/sites:/etc/caddy/sites:ro
      - ${DATA_DIR:-/srv/extras-erp}/caddy/data:/data
      - ${DATA_DIR:-/srv/extras-erp}/caddy/config:/config
    depends_on:
      app:
        condition: service_started
    networks: [edge]
    logging: *logging

  # --- The demo site (README.md, "The demo site") ----------------------------------
  # A separate copy of the ERP at DEMO_DOMAIN, for trying things out: its own
  # database, files and network, loaded with the Five Style Polo batch. It cannot
  # reach the live database. Only deploy.sh starts it, while deploy/demo.conf says
  # DEMO_SITE=on; the live ERP never waits for it.
  demo-db:
    profiles: [demo]
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    environment:
      POSTGRES_DB: extras_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8 --locale=C.UTF-8
      APP_DB_USER: extras_demo_app
      APP_DB_PASSWORD: ${DEMO_APP_DB_PASSWORD:-}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=30
      - -c
      - idle_in_transaction_session_timeout=10min
    volumes:
      - ${DATA_DIR:-/srv/extras-erp}/demo/postgres:/var/lib/postgresql/data
      - ./postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s
    networks: [demo-internal]
    logging: *logging

  # Brings the demo database up to date, makes the owner and the companies, and
  # loads the Five Style Polo batch the first time (prisma/demo/seed-demo.ts).
  demo-seed:
    profiles: [demo]
    image: extras-erp-tools:latest
    restart: "no"
    command:
      - sh
      - -c
      - >-
        npx prisma migrate deploy && npx prisma db seed &&
        npx tsx prisma/demo/seed-demo.ts && chown -R 1001:1001 /data/uploads
    environment:
      DATABASE_URL: postgresql://extras_demo_app:${DEMO_APP_DB_PASSWORD:-}@demo-db:5432/extras_demo?schema=public
      DEMO_SITE: "on"
      UPLOAD_DIR: /data/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Owner}
      SEED_COMPANIES: ${SEED_COMPANIES:-Extas,Fabric Apparel}
      # The live owner's password hash (deploy.sh), so the same password works here.
      DEMO_OWNER_PASSWORD_HASH: ${DEMO_OWNER_PASSWORD_HASH:-}
    volumes:
      - ${DATA_DIR:-/srv/extras-erp}/demo/uploads:/data/uploads
    depends_on:
      demo-db:
        condition: service_healthy
    networks: [demo-internal]
    logging: *logging

  demo-app:
    profiles: [demo]
    image: extras-erp-app:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      APP_URL: https://${DEMO_DOMAIN:-demo.invalid}
      DATABASE_URL: postgresql://extras_demo_app:${DEMO_APP_DB_PASSWORD:-}@demo-db:5432/extras_demo?schema=public&connection_limit=5
      ENCRYPTION_KEY: ${DEMO_ENCRYPTION_KEY:-}
      # Shows the "Demo site" bar on every page.
      DEMO_SITE: "on"
      # Practice data needs no backups.
      BACKUP_SCHEDULER: "off"
    volumes:
      - ${DATA_DIR:-/srv/extras-erp}/demo/uploads:/data/uploads
      - ${DATA_DIR:-/srv/extras-erp}/demo/backups:/data/backups
    depends_on:
      demo-db:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 3s
    # demo-internal: the demo database only. edge: Caddy.
    networks: [demo-internal, edge]
    logging: *logging

networks:
  # No internet access: the database stays private.
  internal:
    internal: true
  # The demo site's own, the same way; the live database is not on it.
  demo-internal:
    internal: true
  edge: {}
