# The zero-touch production simulations, on a throwaway database made for the run:
#   - "Premium Polo Export Q3" (5 brands, 1,000 pieces each) goes from the 1,00,000
#     advance CM to the final CM settlement and its journal entry;
#   - "Five Style Polo" (6,000 pieces, 5 styles S to XXL) runs the real CM rules:
#     Demo Embo pays for the pieces it spoils, rejects over the 2% allowance and
#     missing pieces come off the factory, with the overheads and the batch summary.
# Each runs on the app's own services, every figure is checked, then it is wiped
# and every table is checked to be exactly as it was. The Simulation Reports
# (every amount posted) are on the run's Summary page and under "Artifacts". It
# runs by itself on every change to production, accounts or the database, and
# from the Actions tab ("Run workflow"). It never touches the live site: the code
# is in tests/simulation/ and prisma/demo/ (Five Style Polo, which also loads the
# demo site: tests/integration/demo-site.test.ts).
name: Production simulation

on:
  pull_request:
    paths:
      - "src/modules/production/**"
      - "src/modules/accounts/**"
      - "src/modules/parties/**"
      - "src/modules/inventory/**"
      - "src/modules/materials/**"
      - "prisma/**"
      - "tests/simulation/**"
      - "tests/integration/production-simulation.test.ts"
      - "tests/integration/five-style-polo.test.ts"
      - "tests/integration/demo-site.test.ts"
      - ".github/workflows/production-simulation.yml"
  push:
    branches: [main]
    paths:
      - "src/modules/production/**"
      - "src/modules/accounts/**"
      - "src/modules/parties/**"
      - "src/modules/inventory/**"
      - "src/modules/materials/**"
      - "prisma/**"
      - "tests/simulation/**"
      - "tests/integration/production-simulation.test.ts"
      - "tests/integration/five-style-polo.test.ts"
      - "tests/integration/demo-site.test.ts"
      - ".github/workflows/production-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    name: Run the simulation and wipe it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: extras
          POSTGRES_PASSWORD: extras
          POSTGRES_DB: extras_erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U extras -d extras_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://extras:extras@localhost:5432/extras_erp_test?schema=public
      SIMULATION_REPORT: simulation-report.md
      FIVE_STYLE_POLO_REPORT: five-style-polo-report.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Premium Polo Export Q3, check every figure, wipe it
        run: npm run simulate:production

      - name: Run Five Style Polo (6,000 pieces, the real CM rules), check every figure, wipe it
        if: always()
        run: npm run simulate:five-style-polo

      - name: Load the demo site's sample data (prisma/demo), once, on a fresh company
        if: always()
        run: npx vitest run tests/integration/demo-site.test.ts

      - name: Put the Simulation Reports on the Summary page
        if: always()
        run: |
          for report in "$FIVE_STYLE_POLO_REPORT" "$SIMULATION_REPORT"; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No $report: that simulation stopped before the end. Its step above says where." >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-report
          path: |
            simulation-report.md
            five-style-polo-report.md
          if-no-files-found: ignore
