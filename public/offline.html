<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d2e" />
    <title>You are offline · Extas ERP</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8f8f8;
        color: #1f2a26;
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font:
          600 1.5rem/1.2 Georgia,
          serif;
        color: #0b3d2e;
      }
      p {
        margin: 0 0 1.5rem;
        color: #5b6560;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        background: #0b3d2e;
        color: #fff;
        font: inherit;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>
        Extas ERP needs the internet. Check your mobile data or Wi-Fi, then try again. If you are
        checked in on the Extas ERP Android app, it keeps your location and sends it when the
        connection is back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
